[package]
name = "neothesia"
version = "0.4.0"
authors = ["Poly <marynczak.bartlomiej@gmail.com>"]
edition.workspace = true
default-run = "neothesia"

[features]
default = ["oxi-synth"]

profiling-on = ["profiling/profile-with-puffin", "puffin", "puffin_http"]
synth = []
fluid-synth = ["synth", "fluidlite", "oxisynth"]
oxi-synth = ["synth", "oxisynth"]

[dependencies]
thiserror.workspace = true
pollster.workspace = true
log.workspace = true
env_logger.workspace = true
wgpu.workspace = true
wgpu-jumpstart.workspace = true
neothesia-core.workspace = true
neothesia-image.workspace = true
midi-file.workspace = true
midi-io.workspace = true
nuon.workspace = true
futures-channel.workspace = true
cosmic-text.workspace = true

bytes.workspace = true
lilt.workspace = true
winit.workspace = true
rfd.workspace = true

# Not optional: the microphone passthrough uses it whether or not the built-in
# synth is compiled in, and rodio already pulls a copy of it in regardless.
cpal.workspace = true
rodio = { version = "0.22", default-features = false, features = ["playback", "vorbis", "mp3", "wav"] }
fluidlite = { workspace = true, optional = true }
oxisynth = { workspace = true, optional = true }

profiling.workspace = true
puffin = { workspace = true, optional = true }
puffin_http = { workspace = true, optional = true }
piano-layout.workspace = true

[[bin]]
name = "neothesia"

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource.workspace = true
